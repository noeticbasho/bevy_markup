# Nightly: checks that need a renderer, a browser or time. Failures here
# are reports to triage (see AGENTS.md "Testing"), not merge blockers.
name: Nightly

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  # Dated nightly for the fuzz jobs, so their build caches (keyed on the
  # toolchain version) survive across days; = cache.yml. Bump both together.
  BEVY_MARKUP_NIGHTLY: nightly-2026-09-09

jobs:
  benches:
    # ADR 0018 + 0019: trend evidence, not a gate — runner timings are
    # noisy and criterion's baselines don't transfer between runners. The
    # artifacts are the record; compare across nights by eye.
    name: Benchmarks (criterion + divan)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Install Bevy's build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev libfontconfig-dev
      - uses: dtolnay/rust-toolchain@stable
      - id: cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: bench
          save-if: false
      - name: Warn on a build-cache miss
        if: steps.cache.outputs.cache-hit != 'true'
        run: echo "::warning::no exact 'bench' build cache (dependencies changed since cache.yml last ran on main); building from scratch"
      - name: Run the criterion suite
        run: cargo bench --bench pipeline -- --warm-up-time 0.5 --measurement-time 2
      - name: Run the divan suite (allocation counts)
        shell: bash
        # `shell: bash` gives `-e -o pipefail`: a panicking bench fails the
        # step instead of `tee`'s exit status masking it.
        run: cargo bench --bench pipeline-divan -- --max-time 2 | tee target/divan.txt
      # ADR 0038: the SVG stages and frame workloads (both harnesses).
      - name: Run the SVG criterion suite
        run: cargo bench --features fuzzing --bench svg -- --warm-up-time 0.5 --measurement-time 2
      - name: Run the SVG divan suite (allocation counts)
        shell: bash
        run: cargo bench --features fuzzing --bench svg-divan -- --max-time 2 | tee target/divan-svg.txt
      - name: Upload the reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: criterion-reports
          path: target/criterion/
      - name: Upload the divan output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: divan-report
          path: |
            target/divan.txt
            target/divan-svg.txt

  golden:
    # Restores the `dev` cache the CI `test` job saves: needs CI's
    # CARGO*/RUST* variables (ci.yml `env`) to hash the same.
    env:
      RUSTFLAGS: -D warnings
      RUSTDOCFLAGS: -D warnings
    name: Golden images (lavapipe)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Free disk space (full-Bevy builds are large)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Install Bevy's build dependencies and Mesa's software Vulkan (lavapipe)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev libfontconfig-dev mesa-vulkan-drivers
      - uses: dtolnay/rust-toolchain@stable
      - id: cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: dev
          save-if: false
      - name: Warn on a build-cache miss
        if: steps.cache.outputs.cache-hit != 'true'
        run: echo "::warning::no exact 'dev' build cache (dependencies or toolchain changed since CI last ran on main, or this job's env differs from ci.yml's); building from scratch"
      - name: Render and compare (scripts/golden.sh picks the installed lavapipe ICD)
        run: scripts/golden.sh
      - name: Upload actual and diff images
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: golden-diffs
          path: target/tmp/golden/
          if-no-files-found: ignore

  golden-update:
    # CI's runner is the canonical renderer: runner image updates move Mesa,
    # and the `golden` job fails until the references follow. Re-records
    # them on the runner, verifies they reproduce, and uploads them; copy
    # the PNGs into tests/golden/<scene>/ and commit (`gh run download
    # <run-id> -n golden-references`).
    if: github.event_name == 'workflow_dispatch'
    name: Update golden references (lavapipe)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Restores the `dev` cache the CI `test` job saves: needs CI's
    # CARGO*/RUST* variables (ci.yml `env`) to hash the same.
    env:
      RUSTFLAGS: -D warnings
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7
      - name: Free disk space (full-Bevy builds are large)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Install Bevy's build dependencies and Mesa's software Vulkan (lavapipe)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev libfontconfig-dev mesa-vulkan-drivers
      - uses: dtolnay/rust-toolchain@stable
      - id: cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: dev
          save-if: false
      - name: Warn on a build-cache miss
        if: steps.cache.outputs.cache-hit != 'true'
        run: echo "::warning::no exact 'dev' build cache (dependencies or toolchain changed since CI last ran on main, or this job's env differs from ci.yml's); building from scratch"
      - name: Rewrite the references (scripts/golden.sh --update)
        run: scripts/golden.sh --update
      # lavapipe is bit-identical run to run at a given version: the rewrite
      # must survive a plain comparison run, or the references aren't stable.
      - name: Verify the new references reproduce
        run: scripts/golden.sh
      - name: Upload the new references
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: golden-references
          path: tests/golden/*/expected.png
          if-no-files-found: error

  browser-oracle:
    name: Browser oracle references match current Chrome
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Regenerate tests/vectors/*/browser.json with headless Chrome
        env:
          BEVY_MARKUP_BROWSER: google-chrome
        run: scripts/browser_oracle.py
      - name: Compare with the committed references (ignoring the generator line)
        run: |
          # Untracked files (a new vector committed without its generated
          # output) don't show in git diff — catch them too (tracked
          # modifications are `git diff`'s job; the generator line nightly
          # ignores must not defeat it).
          if [ -n "$(git ls-files --others --exclude-standard tests/vectors)" ] \
            || ! git diff --exit-code -I '"generator"' -- tests/vectors; then
            echo "::error::Chrome computes differently from the committed browser.json: review; if the browser is right, regenerate and commit, then fix bevy_markup"
            exit 1
          fi

  coverage:
    name: Coverage per testing layer
    # After the fuzz jobs, so the fuzz-corpora layer replays tonight's
    # corpora (restored below); also when a fuzz job failed.
    needs: fuzz
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Free disk space (full-Bevy builds are large)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Install Bevy's Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev libfontconfig-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      # The fuzz-corpora layer replays fuzz/seeds plus fuzz/corpus: restore
      # the newest corpus each fuzz job saved (the key itself never exists;
      # restore-keys picks the most recent entry).
      - name: Restore the html fuzz corpus
        uses: actions/cache/restore@v6
        with:
          path: fuzz/corpus/html
          key: fuzz-corpus-html-for-coverage-${{ github.run_id }}
          restore-keys: fuzz-corpus-html-
      - name: Restore the css fuzz corpus
        uses: actions/cache/restore@v6
        with:
          path: fuzz/corpus/css
          key: fuzz-corpus-css-for-coverage-${{ github.run_id }}
          restore-keys: fuzz-corpus-css-
      - name: Restore the ftl fuzz corpus
        uses: actions/cache/restore@v6
        with:
          path: fuzz/corpus/ftl
          key: fuzz-corpus-ftl-for-coverage-${{ github.run_id }}
          restore-keys: fuzz-corpus-ftl-
      - name: Restore the svg fuzz corpus
        uses: actions/cache/restore@v6
        with:
          path: fuzz/corpus/svg
          key: fuzz-corpus-svg-for-coverage-${{ github.run_id }}
          restore-keys: fuzz-corpus-svg-
      - name: Measure
        shell: bash
        run: |
          scripts/coverage.py --html | tee coverage.txt
          { echo '### Line coverage of src/ per testing layer'; echo '```'; cat coverage.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: target/coverage/

  fuzz:
    name: Fuzz ${{ matrix.target }} (cargo-fuzz, 15 min)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # The corpus persists across nights as a GitHub cache: each run restores
    # the newest `fuzz-corpus-<target>-*` entry, fuzzes on from there and
    # saves a new entry (also after a crash). Old entries age out after 7
    # days unused; if all of them do, fuzzing starts from scratch again.
    strategy:
      fail-fast: false
      matrix:
        target: [html, css, ftl, svg]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.BEVY_MARKUP_NIGHTLY }}
      - id: cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: fuzz
          workspaces: fuzz
          save-if: false
      - name: Warn on a build-cache miss
        if: steps.cache.outputs.cache-hit != 'true'
        run: echo "::warning::no exact 'fuzz' build cache (dependencies or toolchain changed since cache.yml last ran, or this job's env differs from cache.yml's); building from scratch"
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - name: Restore the corpus from the last run
        uses: actions/cache/restore@v6
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-
      # Weekly (Sundays, UTC): drop inputs that add no coverage
      # (libFuzzer -merge=1), so the corpus stays small and fast to replay.
      - name: Minimize the corpus (Sundays)
        run: |
          dir=fuzz/corpus/${{ matrix.target }}
          count() { find "$dir" -type f 2>/dev/null | wc -l; }
          if [ "$(date -u +%u)" != 7 ] || [ "$(count)" = 0 ]; then exit 0; fi
          before=$(count)
          host=$(rustc -vV | sed -n 's/^host: //p')
          (cd fuzz && cargo "+$BEVY_MARKUP_NIGHTLY" fuzz cmin --target "$host" ${{ matrix.target }})
          echo "corpus minimized: $before → $(count) inputs"
      # 15 min per target (minutes are free for public repos). libFuzzer's
      # default 2 GB RSS limit would be hit by memory that only grows with
      # the run (corpus, ASan quarantine): css reached 1 GB after 5 min.
      # 4 GB of the runner's 16 GB; a real leak still fails, just later.
      - name: Fuzz
        run: |
          scripts/fuzz-libfuzzer.sh ${{ matrix.target }} 900 -rss_limit_mb=4096
          echo "corpus: $(find fuzz/corpus/${{ matrix.target }} -type f | wc -l) inputs"
      - name: Save the corpus for the next run
        if: always()
        uses: actions/cache/save@v6
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
      # Caches can't be downloaded; the artifact can (`gh run download <run>
      # -n fuzz-corpus-<target>`), to fold into fuzz/seeds (see
      # docs/agents/skills/testing.md, fuzzing).
      - name: Upload the corpus
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-corpus-${{ matrix.target }}
          path: fuzz/corpus/${{ matrix.target }}/
          if-no-files-found: ignore
          retention-days: 90
      - name: Upload crashing inputs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/
          if-no-files-found: ignore

  fuzz-drivers:
    name: Fuzz ${{ matrix.target }} (${{ matrix.driver }}, 15 min)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # The other three drivers over the same harnesses (AGENTS.md, Testing
    # TODO 5). Until 2026-11-12 this job only compiled them. Each driver's
    # tools and build come from its `fuzz-<driver>` cache (cache.yml, built
    # by the same scripts/fuzz-setup.sh); the working corpus carries over
    # between nights like the cargo-fuzz jobs'.
    strategy:
      fail-fast: false
      matrix:
        driver: [honggfuzz, fuzzcheck, test-fuzz]
        target: [html, css, ftl]
        include: # = cache.yml `fuzz-drivers`
          - driver: honggfuzz
            workspaces: honggfuzz -> ../hfuzz_target
            corpus: hfuzz_workspace/TARGET/input
            crashes: hfuzz_workspace/TARGET
          - driver: fuzzcheck
            workspaces: fuzzcheck
            corpus: fuzzcheck/fuzz/fuzz_TARGET/corpus
            crashes: fuzzcheck/fuzz/fuzz_TARGET/artifacts
          - driver: test-fuzz
            workspaces: test-fuzz
            # AFL++ as `cargo afl config --build` leaves it.
            directories: ~/.local/share/afl.rs
            # AFL's queue isn't carried over: each night starts from the
            # seeds the crate's `cargo test` run records.
            corpus: ""
            crashes: test-fuzz/target/afl/output
    env:
      # honggfuzz kills an input after 1 s by default; the runner is slower
      # than the machines its harness was tuned on. = cargo-fuzz's -timeout.
      HFUZZ_RUN_ARGS: -t 10
    steps:
      - uses: actions/checkout@v7
      - name: Install the honggfuzz build dependencies
        if: matrix.driver == 'honggfuzz'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends binutils-dev libunwind-dev liblzma-dev
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.BEVY_MARKUP_NIGHTLY }}
      - id: cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: fuzz-${{ matrix.driver }}
          workspaces: ${{ matrix.workspaces }}
          cache-directories: ${{ matrix.directories }}
          save-if: false
      - name: Warn on a build-cache miss
        if: steps.cache.outputs.cache-hit != 'true'
        run: echo "::warning::no exact 'fuzz-${{ matrix.driver }}' build cache (dependencies or toolchain changed since cache.yml last ran, or this job's env differs from cache.yml's); installing the tools and building from scratch"
      - name: Install the driver's tools and build its targets (nothing to do on a cache hit)
        run: scripts/fuzz-setup.sh ${{ matrix.driver }}
      - id: paths
        name: Resolve this target's corpus and crash paths
        run: |
          corpus='${{ matrix.corpus }}'
          crashes='${{ matrix.crashes }}'
          echo "corpus=${corpus//TARGET/${{ matrix.target }}}" >> "$GITHUB_OUTPUT"
          echo "crashes=${crashes//TARGET/${{ matrix.target }}}" >> "$GITHUB_OUTPUT"
      - name: Restore the corpus from the last run
        if: steps.paths.outputs.corpus != ''
        uses: actions/cache/restore@v6
        with:
          path: ${{ steps.paths.outputs.corpus }}
          key: fuzz-corpus-${{ matrix.driver }}-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: fuzz-corpus-${{ matrix.driver }}-${{ matrix.target }}-
      # Each script exits non-zero when its driver saved a new crashing
      # input (and only then: a time budget that runs out is success).
      - name: Fuzz
        run: scripts/fuzz-${{ matrix.driver }}.sh ${{ matrix.target }} 900
      - name: Save the corpus for the next run
        if: always() && steps.paths.outputs.corpus != ''
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.paths.outputs.corpus }}
          key: fuzz-corpus-${{ matrix.driver }}-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
      # As a tarball: AFL's file names hold `:`, which artifacts refuse.
      - name: Pack crashing inputs
        if: failure()
        run: |
          if [ -e "${{ steps.paths.outputs.crashes }}" ]; then
            tar -czf fuzz-crashes.tar.gz "${{ steps.paths.outputs.crashes }}"
          fi
      - name: Upload crashing inputs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-artifacts-${{ matrix.driver }}-${{ matrix.target }}
          path: fuzz-crashes.tar.gz
          if-no-files-found: ignore
